name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # dry-run du générateur SANS appel Mistral (mécanique du pipeline uniquement)
      - name: Dry-run du générateur (sans LLM)
        run: npm run start -w generator -- --no-llm --out /tmp/veille-dry-run
