name: Veille quotidienne

# Génère la veille SRE (collecte sources + analyse Mistral), commite data/ sur main
# et envoie une notification ntfy.sh. Le déploiement GitHub Pages est déclenché
# séparément par deploy-pages.yml sur chaque push sur main.
on:
  schedule:
    # Créneaux décalés en minutes : GitHub documente un pic de charge (et des runs
    # manqués) au début de chaque heure. Plusieurs créneaux = rattrapage si l'un d'eux
    # est manqué ; le garde-fou ci-dessous rend les doublons impossibles.
    - cron: '7 7 * * *'   # 07:07 UTC
    - cron: '37 7 * * *'  # 07:37 UTC (rattrapage)
    - cron: '22 8 * * *'  # 08:22 UTC (dernier rattrapage)
  workflow_dispatch: # déclenchement manuel
    inputs:
      force:
        description: 'Forcer la génération même si la veille du jour existe déjà'
        type: boolean
        required: false
        default: false

permissions:
  contents: write # pour pousser le commit data/
  actions: write  # pour déclencher deploy-pages.yml via l'API (voir step ci-dessous)

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Garde-fou idempotent : si la veille du jour existe déjà dans data/, on saute
      # (protège contre les créneaux de rattrapage qui se suivent et les runs manuels
      # répétés). Un dispatch manuel avec force=true bypass ce garde-fou.
      - name: Garde-fou — la veille du jour existe déjà ?
        id: guard
        env:
          FORCE: ${{ inputs.force }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [ "$FORCE" != "true" ] && [ -f "data/veille-$TODAY.json" ]; then
            echo "Veille du $TODAY déjà présente dans data/ — rien à faire."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.guard.outputs.skip != 'true'

      - name: Génère la veille (collecte + Mistral)
        if: steps.guard.outputs.skip != 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: npm run start -w generator

      - name: Commit data/ si la veille a changé
        if: steps.guard.outputs.skip != 'true'
        id: commit
        run: |
          git config user.name "vibe-veille-bot"
          git config user.email "vibe-veille-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucun changement dans data/"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "chore(data): veille SRE du $DATE"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Un push effectué avec le GITHUB_TOKEN ne déclenche AUCUN workflow on:push
      # (règle GitHub) : on déclenche donc explicitement le déploiement Pages via l'API.
      - name: Déclenche le déploiement Pages
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "deploy-pages.yml déclenché via l'API"

      - name: Notification ntfy.sh
        if: steps.guard.outputs.skip != 'true' && steps.commit.outputs.changed == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          # URL du site déployé : au clic sur la notif, PC -> onglet navigateur,
          # téléphone -> la PWA installée s'ouvre (l'URL est dans son scope)
          SITE_URL: ${{ vars.SITE_URL || 'https://manuelpayet.github.io/vibe-veille/' }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "Secret NTFY_TOPIC non configuré : notification ignorée"
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          AUTH=()
          if [ -n "$NTFY_TOKEN" ]; then AUTH=(-H "Authorization: Bearer $NTFY_TOKEN"); fi
          curl -sf -X POST "https://ntfy.sh/$NTFY_TOPIC" \
            -H "Title: Nouvelle veille SRE - $DATE" \
            -H "Priority: 3" \
            -H "Tags: satellite" \
            -H "Click: $SITE_URL" \
            -H "Icon: ${SITE_URL}icons/icon-192.png" \
            "${AUTH[@]}" \
            -d "Ta veille SRE du $DATE est en ligne : $SITE_URL"

      # Heartbeat healthchecks.io : alerte si aucun run ne se termine un jour donné
      # (watchdog externe + cron GitHub tombés en panne). Secret HEALTHCHECKS_PING_URL :
      # URL de ping du check (https://hc-ping.com/<uuid>), check attendu 1x/jour, grace 2h.
      - name: Ping healthchecks.io
        if: always()
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: |
          if [ -z "$HEALTHCHECKS_PING_URL" ]; then
            echo "Secret HEALTHCHECKS_PING_URL non configuré : ping ignoré"
            exit 0
          fi
          if [ "${{ job.status }}" = "success" ]; then
            curl -sf "$HEALTHCHECKS_PING_URL" || echo "ping healthchecks échoué (non bloquant)"
          else
            curl -sf "$HEALTHCHECKS_PING_URL/fail" || echo "ping healthchecks /fail échoué (non bloquant)"
          fi
